}
function texto() {
  let t = `*Roteiro de visitas · RCA ${DADOS.rca} ${DADOS.nome}*\n`;
  DIAS.forEach(([d, , nome]) => {
    const l = DADOS.clientes.filter(c => escolha[c.cod] === d);
    if (!l.length) return;
    t += `\n*${nome.toUpperCase()}* (${l.length})\n` + l.map(c => `• ${c.cod} ${titulo(c)} – ${c.bairro}`).join("\n") + "\n";
  });
  const sem = DADOS.clientes.filter(c => !escolha[c.cod]);
  if (sem.length) t += `\n*SEM DIA* (${sem.length})\n` + sem.map(c => `• ${c.cod} ${titulo(c)}`).join("\n") + "\n";
  return t;
}
function filtros() {
  const ops = [["todos","Todos"],["sem","Sem dia"]].concat(DIAS.map(([d, a]) => [d, a]));
  $("filtros").innerHTML = ops.map(([k, r]) => `<button type="button" data-f="${k}" aria-pressed="${filtro === k}">${r}</button>`).join("");
}
function lista() {
  const q = termo.trim().toUpperCase();
  const vis = DADOS.clientes.filter(c => {
    if (filtro === "sem" && escolha[c.cod]) return false;
    if (filtro !== "todos" && filtro !== "sem" && escolha[c.cod] !== filtro) return false;
    if (q && !(c.cod + " " + c.fantasia + " " + c.razao + " " + c.bairro).toUpperCase().includes(q)) return false;
    return true;
  });
  if (!vis.length) { $("lista").innerHTML = `<p class="vazio">Nenhum cliente neste filtro.</p>`; return; }
  const grupos = {};
  vis.forEach(c => (grupos[c.bairro + " · " + c.cidade] ||= []).push(c));
  $("lista").innerHTML = Object.entries(grupos).map(([b, cs]) => `<section class="bairro"><h2>${esc(b)} <small>${cs.length} cliente${cs.length > 1 ? "s" : ""}</small></h2>` +
    cs.map(c => { const d = escolha[c.cod];
      return `<article class="pdv${d ? " marcado" : ""}" style="${d ? "--cor:" + COR(d) : ""}">
        <div class="l1"><span class="cod">${c.cod}</span><span class="fant">${esc(titulo(c))}</span>${c.bloq ? '<span class="tag">BLOQUEADO</span>' : ""}</div>
        <div class="razao">${esc(c.razao)}</div>
        <div class="end">${esc(c.endereco)} · ${esc(c.bairro)}${c.ult ? " · últ. compra " + c.ult : ""}</div>
        <div class="botoes">${DIAS.map(([k, a]) => `<button type="button" data-c="${c.cod}" data-d="${k}" style="--cor:${COR(k)}" aria-pressed="${d === k}">${a}</button>`).join("")}</div>
      </article>`; }).join("") + `</section>`).join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.c) {
    const c = b.dataset.c, d = b.dataset.d;
    if (escolha[c] === d) delete escolha[c]; else escolha[c] = d;
    salvar(); resumo(); lista();
  } else if (b.dataset.f) { filtro = b.dataset.f; filtros(); lista(); }
  else if (b.id === "copiar") {
    const t = texto();
    const ok = () => { b.textContent = "Copiado!"; setTimeout(() => b.textContent = "Copiar", 1600); };
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(ok).catch(() => {
      const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (er) {} ta.remove(); });
  }
});
$("busca").addEventListener("input", e => { termo = e.target.value; lista(); });
filtros(); resumo(); lista();
</script>
</body>
</html>
